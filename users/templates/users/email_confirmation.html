<!DOCTYPE html>
<html>
<head>
    <title>Подтверждение Email</title>
</head>
<body>
    <h2>Добро пожаловать!</h2>
    <p>Спасибо за регистрацию. Пожалуйста, нажмите на ссылку ниже, чтобы подтвердить свой email:</p>
    <!-- ИСПОЛЬЗУЕМ protocol, domain и url (только путь) -->
    <a href="{{ protocol }}://{{ domain }}{{ url }}">Подтвердить Email</a>
    <p>Если вы не регистрировались, просто проигнорируйте это письмо.</p>
</body>
</html>
